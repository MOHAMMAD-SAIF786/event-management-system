<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=       , initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="POST">

    {% csrf_token %}

    {% if messages %}

        {% for message in messages %}

            <div class="alert">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}

    <div class="input-box">

        <i class="fa-solid fa-user"></i>

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

    </div>

    <div class="input-box">

        <i class="fa-solid fa-lock"></i>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

    </div>

    <button type="submit">

        Login

    </button>

</form>
</body>
</html>
