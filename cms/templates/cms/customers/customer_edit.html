{% extends 'cms/base.html' %}
{% load static %}

{% block title %}
  Edit Customer
{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'cms/css/customer_edit.css' %}" />
{% endblock %}

{% block content %}
  <p style="color:#777;margin-top:-20px;margin-bottom:30px;">Update customer information and save the latest details.</p>
  <div class="edit-wrapper">
    <form method="POST">
      {% csrf_token %}

      <h2>Edit Customer</h2>

      <div class="form-group">
        <label>Name</label>

        <input type="text" name="name" value="{{ customer.name }}" required />
      </div>

      <div class="form-group">
        <label>Phone</label>

        <input type="text" name="phone" value="{{ customer.phone }}" required />
      </div>

      <div class="form-group">
        <label>Email</label>

        <input type="email" name="email" value="{{ customer.email }}" />
      </div>

      <div class="form-group">
        <label>Address</label>

        <textarea name="address" rows="4">{{ customer.address }}</textarea>
      </div>

      <div class="btn-group">
        <button type="submit" class="save-btn">Save Changes</button>

        <a href="{% url 'cms:customer_detail' customer.id %}" class="cancel-btn">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
