{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      {% block title %}
        CMS Dashboard
      {% endblock %}
    </title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <link rel="stylesheet" href="{% static 'cms/css/sidebar.css' %}">
    <link rel="stylesheet" href="{% static 'cms/css/header.css' %}">
    <link rel="stylesheet" href="{% static 'cms/css/dashboard.css' %}" />
    <link rel="stylesheet" href="{% static 'cms/css/customer_list.css' %}">

    {% block extra_css %}
    {% endblock %}
  </head>

  <body>
    {% include 'cms/partials/sidebar.html' %}

    <div class="main-content">

      <main>
        {% block content %}

        {% endblock %}
      </main>

      {% include 'cms/partials/footer.html' %}
    </div>

    <script src="{% static 'cms/js/sidebar.js' %}"></script>
    <script src="{% static 'cms/js/dashboard.js' %}"></script>
    <script src="{% static 'cms/js/furniture.js' %}"></script>


    {% block extra_js %}
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
